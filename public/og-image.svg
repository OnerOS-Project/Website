<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f1115"/>
      <stop offset="50%" stop-color="#181a20"/>
      <stop offset="100%" stop-color="#0f1115"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="200" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#47b895"/>
      <stop offset="100%" stop-color="#5cd4a8"/>
    </linearGradient>
    <radialGradient id="glow" cx="600" cy="280" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#47b895" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#47b895" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Glow -->
  <ellipse cx="600" cy="280" rx="500" ry="300" fill="url(#glow)"/>
  <!-- Window frame -->
  <rect x="200" y="120" width="800" height="400" rx="16" fill="#181a20" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Window title bar -->
  <rect x="200" y="120" width="800" height="44" rx="16" fill="#22252e"/>
  <rect x="200" y="152" width="800" height="12" fill="#22252e"/>
  <!-- Window controls -->
  <circle cx="228" cy="142" r="6" fill="#ef4444"/>
  <circle cx="248" cy="142" r="6" fill="#f59e0b"/>
  <circle cx="268" cy="142" r="6" fill="#10b981"/>
  <!-- Window title -->
  <text x="600" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">OnerOS — Fluent Valley</text>
  <!-- Window content lines -->
  <rect x="240" y="200" width="300" height="8" rx="4" fill="rgba(255,255,255,0.06)"/>
  <rect x="240" y="220" width="200" height="8" rx="4" fill="rgba(255,255,255,0.04)"/>
  <rect x="240" y="240" width="250" height="8" rx="4" fill="rgba(255,255,255,0.04)"/>
  <!-- Taskbar -->
  <rect x="200" y="476" width="800" height="44" fill="rgba(15,17,21,0.75)"/>
  <rect x="200" y="476" width="800" height="1" fill="rgba(255,255,255,0.06)"/>
  <!-- Taskbar icons -->
  <rect x="540" y="488" width="28" height="28" rx="6" fill="rgba(255,255,255,0.06)"/>
  <rect x="576" y="488" width="28" height="28" rx="6" fill="rgba(96,165,250,0.15)"/>
  <rect x="612" y="488" width="28" height="28" rx="6" fill="rgba(255,255,255,0.06)"/>
  <!-- OnerOS Logo -->
  <text x="600" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="48" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-1">Oner</text>
  <text x="688" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="48" font-weight="700" fill="url(#accent)" text-anchor="middle" letter-spacing="-1">OS</text>
  <!-- Tagline -->
  <text x="600" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">An Open-Source Web Operating System Experience</text>
  <!-- Bottom accent line -->
  <rect x="520" y="420" width="160" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
