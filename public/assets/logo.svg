<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" fill="none">
  <defs>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#47b895"/>
      <stop offset="100%" stop-color="#5cd4a8"/>
    </linearGradient>
  </defs>
  <!-- "Oner" in white -->
  <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Oner</text>
  <!-- "OS" in accent gradient -->
  <text x="72" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="url(#accent-grad)" letter-spacing="-0.5">OS</text>
</svg>
