<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnerOS — Page Not Found</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/assets/logo-mark.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/tokens/colors.css">
  <link rel="stylesheet" href="/css/tokens/typography.css">
  <link rel="stylesheet" href="/css/tokens/spacing.css">
  <link rel="stylesheet" href="/css/tokens/shadows.css">
  <link rel="stylesheet" href="/css/tokens/motion.css">
  <link rel="stylesheet" href="/css/tokens/surfaces.css">
  <link rel="stylesheet" href="/css/globals.css">
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-8);
    }
    .error-code {
      font-size: clamp(4rem, 10vw, 8rem);
      font-weight: var(--font-weight-bold);
      background: linear-gradient(135deg, var(--color-accent), var(--color-accent-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: var(--space-4);
    }
    .error-message {
      font-size: var(--text-xl);
      color: var(--text-secondary);
      margin-bottom: var(--space-8);
    }
    .error-actions {
      display: flex;
      gap: var(--space-4);
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>
  <main class="error-page">
    <div class="error-code" aria-hidden="true">404</div>
    <h1 class="error-message">This surface doesn't exist</h1>
    <div class="error-actions">
      <a href="/" class="btn btn--primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Return Home
      </a>
      <a href="https://web-oneros.netlify.app" class="btn btn--secondary" target="_blank" rel="noopener noreferrer">
        Try OnerOS
      </a>
    </div>
  </main>
</body>
</html>
